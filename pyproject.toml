[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sylus"
version = "0.1.0"
description = "Sylus - Grand Strategy Discord Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "py-cord==2.8.1",
    "sqlalchemy[asyncio]==2.1.6",
    "aiosqlite==0.22.1",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "aiohttp==3.14.5",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "structlog==26.1.0",
    "numpy>=2.0.0",
    "pillow>=10.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
